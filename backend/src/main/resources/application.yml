spring:
  application:
    name: rehmani-trading-erp

  datasource:
    url: jdbc:mysql://localhost:3306/rehmani_trading?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Sized for ~10 concurrent shared sessions without hanging
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    # Override in production: JWT_SECRET=<long-random-secret>
    secret: ${JWT_SECRET:RehmaniTradingCompanySecretKey2026EnterpriseERPSystemSecureToken}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated origins for production domain, e.g. https://yourdomain.com,https://www.yourdomain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  company:
    name: Rehmani Trading Company
  ai:
    # Server-side only (not editable in Settings UI). Prefer GEMINI_API_KEY; GROQ_API_KEY is optional fallback.
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.0-flash}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    openai-model: ${OPENAI_MODEL:gpt-4o-mini}
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:llama-3.3-70b-versatile}

logging:
  level:
    com.rehmani: INFO
    org.springframework.security: WARN

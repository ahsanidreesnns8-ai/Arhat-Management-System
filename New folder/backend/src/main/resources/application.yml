spring:
  application:
    name: rehmani-trading-erp

  datasource:
    url: jdbc:mysql://localhost:3306/rehmani_trading?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /api

app:
  jwt:
    secret: RehmaniTradingCompanySecretKey2026EnterpriseERPSystemSecureToken
    expiration-ms: 86400000
  company:
    name: Rehmani Trading Company

logging:
  level:
    com.rehmani: INFO
    org.springframework.security: WARN
